<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Works — J. Bell Price</title>

  <!-- Shared typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

<nav class="nav">
  <div class="container nav-inner">
    <a class="logo" href="index.html">J. BELL PRICE</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="works.html" class="active">Works</a>
      <a href="about.html">About</a>
      <a href="shop.html">Shop</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</nav>

<main>

  <section class="hero works-hero">
    <div class="container">
      <p class="kicker">Archive</p>

      <h1>Collected Works</h1>

      <p class="works-intro">
        Poems, essays, visual notes, and fragments gathered over time.
        Browse by theme, follow recurring motifs, or move through the archive chronologically.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-header">
        <p class="kicker">Selected Fragments</p>
        <h2>Recent Work</h2>
      </div>

      <div id="works-featured" class="works-feed"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-header">
        <p class="kicker">Complete Index</p>
        <h2>Archive</h2>
      </div>

      <div class="works-filter-group">
        <p class="works-filter-label">Theme</p>

        <div id="works-theme-filters" class="works-theme-filters"></div>
      </div>

      <div class="works-filter-group">
        <p class="works-filter-label">Type</p>

        <div class="filters archive-filters">
          <button data-filter="all" class="active">All</button>
          <button data-filter="poem">Poems</button>
          <button data-filter="essay">Essays</button>
          <button data-filter="fragment">Fragments</button>
          <button data-filter="art">Art</button>
        </div>
      </div>

      <div id="archive-list" class="archive-list"></div>
    </div>
  </section>

</main>

<script>
let allItems = [];
let activeType = "all";
let activeTheme = "all";

fetch("./data/content.json")
  .then(res => res.json())
  .then(data => {
    allItems = data.sort((a, b) => new Date(b.date) - new Date(a.date));

    renderFeatured();
    renderThemeFilters();
    renderArchive();
  })
  .catch(error => {
    console.error(error);

    const featured = document.getElementById("works-featured");
    const archive = document.getElementById("archive-list");
    const themes = document.getElementById("works-theme-filters");

    if (featured) {
      featured.innerHTML = `<p class="error">Unable to load recent works.</p>`;
    }

    if (themes) {
      themes.innerHTML = `<p class="error">Unable to load themes.</p>`;
    }

    if (archive) {
      archive.innerHTML = `<p class="error">Unable to load works.</p>`;
    }
  });

function renderFeatured() {
  const container = document.getElementById("works-featured");
  if (!container) return;

  container.innerHTML = "";

  allItems.slice(0, 4).forEach((item, i) => {
    const el = document.createElement("a");
    el.href = item.link || "#";
    el.className = "work";
    el.classList.add(i % 2 === 0 ? "align-left" : "align-right");

    const hasImage = item.image && item.image.trim() !== "";

    if (hasImage) {
      el.innerHTML = `
        <div class="work-art">
          <img src="${item.image}" alt="${item.title || ""}">
        </div>

        <div class="work-text">
          <p class="work-meta">${item.type || "work"}</p>
          <h3>${item.title || "Untitled"}</h3>
          <p>${item.description || ""}</p>
        </div>
      `;
    } else {
      el.classList.add("is-text");

      el.innerHTML = `
        <div class="work-text">
          <p class="work-meta">${item.type || "work"}</p>
          <h3>${item.title || "Untitled"}</h3>
          <p>${item.description || ""}</p>
        </div>
      `;
    }

    container.appendChild(el);
  });
}

function renderThemeFilters() {
  const container = document.getElementById("works-theme-filters");
  if (!container) return;

  const themes = [
    ...new Set(
      allItems.flatMap(item => Array.isArray(item.theme) ? item.theme : [])
    )
  ].sort();

  container.innerHTML = "";

  const allButton = document.createElement("button");
  allButton.type = "button";
  allButton.dataset.theme = "all";
  allButton.className = "active";
  allButton.textContent = "All";
  container.appendChild(allButton);

  themes.forEach(theme => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.theme = theme;
    button.textContent = formatLabel(theme);
    container.appendChild(button);
  });

  container.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      container.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      activeTheme = btn.dataset.theme;
      renderArchive();
    });
  });
}

function renderArchive() {
  const archive = document.getElementById("archive-list");
  if (!archive) return;

  archive.innerHTML = "";

  const filtered = allItems.filter(item => {
    const matchesType =
      activeType === "all" || item.type === activeType;

    const itemThemes = Array.isArray(item.theme) ? item.theme : [];

    const matchesTheme =
      activeTheme === "all" || itemThemes.includes(activeTheme);

    return matchesType && matchesTheme;
  });

  if (filtered.length === 0) {
    archive.innerHTML = `<p class="error">No works found for this selection.</p>`;
    return;
  }

  filtered.forEach(item => {
    const el = document.createElement("a");
    el.href = item.link || "#";
    el.className = "archive-item";

    const year = item.date ? new Date(item.date).getFullYear() : "";

    el.innerHTML = `
      <div class="archive-date">${year}</div>
      <div>
        <div class="archive-title">${item.title || "Untitled"}</div>
        <p class="archive-desc">${item.description || ""}</p>
      </div>
      <div class="archive-type">${item.type || "work"}</div>
    `;

    archive.appendChild(el);
  });
}

document.querySelectorAll(".archive-filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".archive-filters button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    activeType = btn.dataset.filter;
    renderArchive();
  });
});

function formatLabel(value) {
  return value
    .replace(/-/g, " ")
    .replace(/\b\w/g, letter => letter.toUpperCase());
}
</script>

</body>
</html>
